name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖（astrbot 提供 astrbot.api，import main.py 的用例需要它）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "astrbot==4.28.1" pypinyin
      - name: 单元测试
        run: python -m pytest -q
      - name: 零耦合门禁（R-IND-02）
        run: python tools/check_no_cross_plugin_imports.py .
