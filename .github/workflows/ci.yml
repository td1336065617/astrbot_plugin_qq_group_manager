name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖（astrbot 提供 astrbot.api，import main.py 的用例需要它）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "astrbot==4.28.1" pypinyin
      - name: 单元测试
        run: python -m pytest -q
      - name: 零耦合门禁（R-IND-02）
        run: python tools/check_no_cross_plugin_imports.py .
      - name: 静态检查（F 类真错误：未定义名/未用导入等）
        run: |
          pip install ruff
          ruff check --select F .
      - name: 非同名目录回归（防目录名脆弱性）
        run: |
          cd ..
          cp -r astrbot_plugin_qq_group_manager renamed_plugin_copy
          cd renamed_plugin_copy
          python -m pytest -q
